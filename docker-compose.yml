services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
    command: npm run start -w server

  client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://server:3001
    command: npm run dev -w client -- --host 0.0.0.0
    depends_on:
      - server
